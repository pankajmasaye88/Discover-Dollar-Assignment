name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push frontend
      run: |
        docker build -t <dockerhub-username>/my-frontend:latest ./frontend
        docker push <dockerhub-username>/my-frontend:latest

    - name: Build and push backend
      run: |
        docker build -t <dockerhub-username>/my-backend:latest ./backend
        docker push <dockerhub-username>/my-backend:latest

    - name: SSH to server and deploy
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /your/app/path
          docker compose pull
          docker compose up -d --force-recreate
