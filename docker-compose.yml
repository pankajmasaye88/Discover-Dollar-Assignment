version: "3.8"

services:

  frontend:
    image: docker123pankaj/my-frontend:latest
    container_name: frontend
    restart: always
    ports:
      - "3000:80"

  backend:
    image: docker123pankaj/my-backend:latest
    container_name: backend
    restart: always
    environment:
      MONGO_URI: mongodb://mongo:27017/mydb
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
